name: Secret guard

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  block-env-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if .env files are tracked (except examples)
        run: |
          set -e
          bad=$(git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -Ev '\.env\.example$|\.env\..*\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Tracked env files must not be in the repo:"
            echo "$bad"
            exit 1
          fi
          echo "OK — no tracked .env secrets"
